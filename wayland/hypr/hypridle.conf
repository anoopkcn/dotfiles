# hypridle — idle blank, lock, sleep. Modelled on macOS.
#
#            BATTERY        AC / DOCKED
#   blank     5:00           15:00
#   lock      5:05           15:05
#   sleep    15:00           45:00
#
# Three things are borrowed from macOS deliberately:
#
#   1. Blank first, lock a few seconds later. macOS has no independent lock
#      timer — locking is "require password after the display turns off", so it
#      hangs off blanking rather than firing on its own earlier clock.
#   2. Separate ladders for battery and AC, which is how pmset models it.
#      hypridle has no native notion of a power source, so each listener is
#      gated on ADP1 via condition_cmd; that gate is the whole reason any
#      guard machinery survives in this file.
#   3. Nothing sniffs for media. Apps that want to stay awake take an idle
#      inhibitor — the Wayland protocol or the org.freedesktop.ScreenSaver
#      D-Bus lock — exactly like macOS power assertions, and hypridle honours
#      both by default. Run `idle-assertions` to see who is holding one.
#
# Lid handling is NOT here, also as on macOS, where clamshell is an explicit
# mode rather than an inference that you left. Undocked lid-close is logind's
# (HandleLidSwitch defaults to suspend); docked lid-close only rearranges
# monitors, via conf/monitors.lua, and never sleeps. Shutting the lid at the
# desk and walking away is therefore just an idle case, handled below.
#
# Idle policy lives here rather than in logind because logind's IdleAction=
# only fires "after all sessions report that they are idle" (logind.conf(5))
# and Hyprland never sets the logind idle hint — the session reads IdleHint=no
# permanently, so IdleAction would look correct and never run.

general {
    # Single-instance lock; SUPER+SHIFT+X and before_sleep route through this
    # via loginctl lock-session.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# ADP1 is type=Mains; online is 1 on AC, 0 on battery. The two conditions below
# are mutually exclusive, so each pair of listeners has exactly one live half.
#
# No condition_retry anywhere, deliberately: a listener whose power state does
# not match at its deadline should be SKIPPED for that idle cycle, not deferred
# — its opposite number already owns the other state. Adding retry would make
# both halves fire.

# --- Battery ----------------------------------------------------------------

listener {
    timeout = 300
    condition_cmd = grep -qx 0 /sys/class/power_supply/ADP1/online
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 305
    condition_cmd = grep -qx 0 /sys/class/power_supply/ADP1/online
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    condition_cmd = grep -qx 0 /sys/class/power_supply/ADP1/online
    on-timeout = systemctl suspend
}

# --- AC / docked ------------------------------------------------------------
#
# The 900s blank below collides with the 900s battery suspend above. That is
# fine and not worth working around — the conditions are mutually exclusive, so
# exactly one of them ever runs.

listener {
    timeout = 900
    condition_cmd = grep -qx 1 /sys/class/power_supply/ADP1/online
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 905
    condition_cmd = grep -qx 1 /sys/class/power_supply/ADP1/online
    on-timeout = loginctl lock-session
}

listener {
    timeout = 2700
    condition_cmd = grep -qx 1 /sys/class/power_supply/ADP1/online
    on-timeout = systemctl suspend
}
