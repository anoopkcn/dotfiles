# hypridle — idle/lock/DPMS (replaces swayidle.sh).
# Lock at 10 min unless audio is playing; screens off at 15 min; suspend at
# 20 min if the lid is shut, or at 30 min on battery. Lock before sleep.
# Fullscreen video never idles (idle_inhibit window rule in rules.lua);
# windowed audio/video is covered by the pactl check below, which replaces
# xidlehook's --not-when-audio. Same caveat as the swayidle version: if audio
# was playing at the 10-min mark, the lock won't re-fire until the next
# activity->idle cycle.
#
# Every suspend that depends on "has the user gone away" lives HERE, because
# only this daemon knows about idle. conf/monitors.lua owns just the two
# physical-event cases it can decide on its own (undock with the lid shut, and
# disabling eDP-1 on a docked lid-close); logind owns undocked lid-close. See
# system/README.md for the full table.

general {
    # Single-instance lock; SUPER+SHIFT+X and before_sleep route through this
    # via loginctl lock-session.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # Chrome holds an org.freedesktop.ScreenSaver "Video Wake Lock" almost
    # permanently — any page with a live video element, even backgrounded — and
    # hypridle stops EVERY listener's timer while an inhibit is held. Result:
    # docked with the lid shut, the external sat lit on the lock screen forever
    # and never DPMS'd off. Dropping the D-Bus veto costs nothing real: the
    # deliberate "don't blank during video" rule is the idle_inhibit =
    # "fullscreen" window rule in conf/rules.lua, which rides the WAYLAND
    # idle-inhibit protocol and is untouched by this. So genuine fullscreen
    # playback still inhibits; a background tab no longer can.
    ignore_dbus_inhibit = true
}

# Lock after 10 min — unless a sink is actively RUNNING (music, video calls).
listener {
    timeout = 600
    on-timeout = pactl list sinks | grep -q RUNNING || loginctl lock-session
}

# Screens off after 15 min, back on at any activity.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Lid shut AND idle for 20 min = you actually left. This is the docked
# "I'm gone" path, and it has to live here rather than in conf/monitors.lua
# because only an idle timer can tell "shut the lid and left" from "shut the lid
# and am working on the external" — the latter is the normal way this machine
# gets used. A timer started from the lid event itself cannot distinguish them
# and will sleep the session out from under an active desk session; that was
# tried and it fails badly. Typing on the external keeps resetting this, so it
# only ever fires once you are genuinely idle.
#
# Reads ACPI directly, same source conf/monitors.lua uses: logind will not act
# on a docked lid-close (HandleLidSwitchDocked=ignore, pinned in
# system/etc/systemd/logind.conf.d/10-lid.conf) and that is deliberate.
listener {
    timeout = 1200
    on-timeout = grep -q closed /proc/acpi/button/lid/LID0/state && ! (pactl list sinks | grep -q RUNNING) && systemctl suspend
}

# Suspend after 30 min — ON BATTERY ONLY, lid open or shut. Docked always means
# AC here (the dock is a PD charger), so this deliberately never fires at the
# desk: long builds, downloads and ssh sessions survive being walked away from.
#
# ADP1 is type=Mains, online = 1 on AC. Same audio guard and same honest caveat
# as the 10-min lock above: if either guard holds at the 30-min mark, this won't
# re-fire until the next activity->idle cycle.
listener {
    timeout = 1800
    on-timeout = grep -qx 0 /sys/class/power_supply/ADP1/online && ! (pactl list sinks | grep -q RUNNING) && systemctl suspend
}
