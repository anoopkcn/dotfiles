# Lid policy. Every value here is already the systemd default — the point is to
# make the dependency EXPLICIT, because wayland/hypr/conf/monitors.lua is built
# on top of it and would misbehave silently if a future systemd changed it.
#
# logind picks HandleLidSwitchDocked over HandleLidSwitch when the machine is in
# a docking station OR when an external display is connected (logind.conf(5)).
# The desk monitor is always connected while docked, so docked lid-closes land
# here and are IGNORED by logind. That is deliberate: closing the lid at the
# desk has to keep the session alive on the external, which is the whole premise
# of monitors.lua.
#
# Suspending is therefore owned by monitors.lua instead, in two places:
#   * docked lid-close      -> arm_lid_suspend(), 90s grace window
#   * undock with lid shut  -> the monitor.removed handler, 8s grace window
# Setting HandleLidSwitchDocked=suspend here would race BOTH of them and break
# working-with-the-lid-shut. Don't.

[Login]
HandleLidSwitch=suspend
HandleLidSwitchDocked=ignore
